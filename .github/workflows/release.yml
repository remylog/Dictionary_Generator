name: Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: dist/dictionary-converter.exe
          - os: macos-latest
            artifact_name: dist/dictionary-converter.app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        python -m unittest discover -s tests

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: pyinstaller --noconsole --onefile --name=dictionary-converter src/app.py

    - name: Build with PyInstaller (Mac)
      if: matrix.os == 'macos-latest'
      run: pyinstaller --noconsole --onedir --name=dictionary-converter src/app.py

    # Macの.appはフォルダ構造なので、zipに圧縮して配布可能にする
    - name: Compress App (Mac)
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r ../dictionary-converter-mac.zip dictionary-converter.app
        cd ..

    - name: Upload Release Asset (Windows)
      if: matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/dictionary-converter.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Asset (Mac)
      if: matrix.os == 'macos-latest'
      uses: softprops/action-gh-release@v2
      with:
        files: dictionary-converter-mac.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}